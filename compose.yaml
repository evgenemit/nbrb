services:
  api:
    build: .
    container_name: fastapi-prod
    command: sh -c "alembic upgrade head && fastapi run src/api/main.py --port 80"
    ports:
      - "80:80"
    restart: always
    environment:
      - DB_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - API_URL=${API_URL}
      - REDIS_HOST=redis_db
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis_db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} --quiet"]
      interval: 3s
      timeout: 10s
      retries: 5

  redis_db:
    image: redis:latest
    container_name: redis-prod
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5


volumes:
  pg_data:
  redisdata:
